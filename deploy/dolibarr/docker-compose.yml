# Dolibarr ERP & CRM hosting — one stack per customer, deployed by Dokploy.
# GPL-3.0: hosting it for customers is allowed; keep its branding and notices.
#
# Product settings: deploy/dolibarr/product.json
# Data: /mnt/nas-sda/dolibarr/<username>/ (database, documents, installed
# modules and this customer's generated keys).
#
# The image writes its conf.php inside the container on each new container
# from the variables below, so only documents and custom modules are kept.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-dolibarr-env: &dolibarr-env
  TZ: ${TIMEZONE}
  PHP_INI_DATE_TIMEZONE: ${TIMEZONE}
  DOLI_URL_ROOT: https://erp-${USERNAME}.${DOMAIN}
  DOLI_PROD: "1"
  DOLI_AUTH: dolibarr
  DOLI_DB_TYPE: mysqli
  DOLI_DB_HOST: mariadb
  DOLI_DB_HOST_PORT: "3306"
  DOLI_DB_NAME: dolibarr
  DOLI_DB_USER: dolibarr
  DOLI_DB_PASSWORD_FILE: /secrets/db_password
  # Encrypts passwords Dolibarr stores (e.g. SMTP), so it must never change.
  DOLI_INSTANCE_UNIQUE_ID_FILE: /secrets/instance_id
  DOLI_CRON_KEY_FILE: /secrets/cron_key
  DOLI_ADMIN_LOGIN: ${ADMIN_LOGIN}

services:
  # Makes this customer's own random keys on the first start and keeps them.
  # Nobody types or sees them; a reset deletes them with the data.
  secrets-init:
    image: busybox:1.36
    restart: "no"
    network_mode: none
    command:
      - sh
      - -ec
      - |
        cd /secrets
        for name in db_password db_root_password instance_id cron_key; do
          [ -s "$$name" ] || tr -dc 'a-f0-9' < /dev/urandom | head -c 32 > "$$name"
        done
        chmod 444 db_password db_root_password instance_id cron_key
    volumes:
      - /mnt/nas-sda/dolibarr/${USERNAME}/secrets:/secrets

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=dolibarr
      - MARIADB_USER=dolibarr
      - MARIADB_PASSWORD_FILE=/secrets/db_password
      - MARIADB_ROOT_PASSWORD_FILE=/secrets/db_root_password
      - TZ=${TIMEZONE}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - /mnt/nas-sda/dolibarr/${USERNAME}/mariadb:/var/lib/mysql
      - /mnt/nas-sda/dolibarr/${USERNAME}/secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M
    logging: *logging

  dolibarr:
    image: docker.io/dolibarr/dolibarr:23.0.4
    restart: unless-stopped
    # The image installs the database and makes the admin on the first start
    # (until documents/install.lock exists) and upgrades it on a newer tag.
    # The customer sets their own admin password; while it is empty the
    # first start stops with an error instead of using the image's "admin".
    entrypoint:
      - sh
      - -ec
      - |
        if [ ! -f /var/www/documents/install.lock ]; then
          if [ -z "$${DOLI_ADMIN_PASSWORD:-}" ]; then
            echo "ADMIN_PASSWORD is empty: set it on your service page, then start again." >&2
            exit 1
          fi
          # The image's installer splits the password on spaces.
          case "$$DOLI_ADMIN_PASSWORD" in
            *[[:space:]]*)
              echo "ADMIN_PASSWORD must not contain spaces." >&2
              exit 1
              ;;
          esac
        fi
        mkdir -p /var/www/html/custom
        chown -R www-data:www-data /var/www/html/custom
        exec docker-run.sh apache2-foreground
    environment:
      <<: *dolibarr-env
      DOLI_INSTALL_AUTO: "1"
      DOLI_INIT_DEMO: "0"
      DOLI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PHP_INI_MEMORY_LIMIT: 256M
      PHP_INI_UPLOAD_MAX_FILESIZE: 20M
      PHP_INI_POST_MAX_SIZE: 25M
    expose:
      - "80"
    volumes:
      - /mnt/nas-sda/dolibarr/${USERNAME}/documents:/var/www/documents
      - /mnt/nas-sda/dolibarr/${USERNAME}/custom:/var/www/html/custom
      - /mnt/nas-sda/dolibarr/${USERNAME}/secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
          pids: 256
        reservations:
          memory: 192M
    logging: *logging

  # Runs Dolibarr's scheduled jobs (reminders, recurring invoices) every 5
  # minutes as the admin user, once the install has finished.
  cron:
    image: docker.io/dolibarr/dolibarr:23.0.4
    restart: unless-stopped
    entrypoint:
      - sh
      - -ec
      - |
        until [ -f /var/www/documents/install.lock ]; do sleep 30; done
        exec docker-run.sh
    environment:
      <<: *dolibarr-env
      DOLI_CRON: "1"
      DOLI_CRON_USER: ${ADMIN_LOGIN}
    volumes:
      - /mnt/nas-sda/dolibarr/${USERNAME}/documents:/var/www/documents
      - /mnt/nas-sda/dolibarr/${USERNAME}/custom:/var/www/html/custom
      - /mnt/nas-sda/dolibarr/${USERNAME}/secrets:/secrets:ro
    depends_on:
      - dolibarr
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
          pids: 64
    logging: *logging
