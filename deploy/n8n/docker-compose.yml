# n8n hosting product — one stack per customer, deployed by Dokploy.
#
# Paste into the product's Deployment > Compose file. Product settings:
#   Name:      n8n-${USERNAME}
#   Domain:    service "n8n", subdomain "n8n-${USERNAME}", port 5678
#   Variables: see deploy/n8n/README.md
#
# Every customer's data lives in /mnt/nas-sda/n8n/<username>/, inside
# DEPLOY_DATA_ROOTS, so "Reset" and the admin "Delete data" can empty it.

services:
  # Makes the n8n data folder writable by the n8n user (uid 1000). Docker
  # creates a missing bind folder as root, which n8n cannot write to.
  init-perms:
    image: busybox:1.36
    restart: "no"
    network_mode: none
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - /mnt/nas-sda/n8n/${USERNAME}/n8n:/data

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
      - TZ=${TIMEZONE}
    # Sized for the memory limit below.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - /mnt/nas-sda/n8n/${USERNAME}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  n8n:
    image: n8nio/n8n:2.23.3
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - GENERIC_TIMEZONE=${TIMEZONE}

      # Public address
      - N8N_HOST=n8n-${USERNAME}.${DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://n8n-${USERNAME}.${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://n8n-${USERNAME}.${DOMAIN}/
      # Traefik sits in front of n8n.
      - N8N_PROXY_HOPS=1

      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # Task runners: the sidecar below shares this container's network, so
      # the broker stays on 127.0.0.1 and no other customer can reach it.
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=127.0.0.1
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}

      # N8N_ENCRYPTION_KEY is left unset on purpose: n8n generates a random
      # key on first start and keeps it in /home/node/.n8n/config, so each
      # customer gets their own. Do not lose that folder while keeping the
      # database: saved credentials could not be decrypted.
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      # Keep the database from growing without end.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=10000
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_TIMEOUT=600
      - EXECUTIONS_TIMEOUT_MAX=1800
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      - N8N_PAYLOAD_SIZE_MAX=16
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem

      # Shared server: keep the shell and host files out of reach.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]

      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_LOG_LEVEL=warn
      # Below the memory limit, so Node collects garbage before it is killed.
      - NODE_OPTIONS=--max-old-space-size=768
    expose:
      - "5678"
    volumes:
      - /mnt/nas-sda/n8n/${USERNAME}/n8n:/home/node/.n8n
    depends_on:
      - init-perms
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 512
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  task-runners:
    image: n8nio/runners:2.23.3-distroless
    restart: unless-stopped
    # Same network namespace as n8n: the broker is at 127.0.0.1:5679.
    network_mode: service:n8n
    environment:
      - TZ=${TIMEZONE}
      - N8N_RUNNERS_TASK_BROKER_URI=http://127.0.0.1:5679
      - N8N_RUNNERS_AUTH_TOKEN=${RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - N8N_RUNNERS_TASK_TIMEOUT=300
    depends_on:
      - n8n
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
