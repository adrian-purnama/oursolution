# Chatwoot (customer support inbox) hosting — one stack per customer,
# deployed by Dokploy. Community edition image (MIT, no enterprise code).
#
# Product settings: deploy/chatwoot/product.json
# Data: /mnt/nas-sda/chatwoot/<username>/ (database, uploads, queue and this
# customer's generated keys).

services:
  # Makes this customer's own random keys on the first start and keeps them.
  secrets-init:
    image: busybox:1.36
    restart: "no"
    network_mode: none
    command:
      - sh
      - -ec
      - |
        cd /secrets
        [ -s db_password ] || tr -dc 'a-f0-9' < /dev/urandom | head -c 32 > db_password
        [ -s secret_key_base ] || tr -dc 'a-f0-9' < /dev/urandom | head -c 128 > secret_key_base
        chmod 444 db_password secret_key_base
    volumes:
      - /mnt/nas-sda/chatwoot/${USERNAME}/secrets:/secrets

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=chatwoot
      - POSTGRES_PASSWORD_FILE=/secrets/db_password
      - POSTGRES_DB=chatwoot_production
      - TZ=${TIMEZONE}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
    volumes:
      - /mnt/nas-sda/chatwoot/${USERNAME}/postgres:/var/lib/postgresql/data
      - /mnt/nas-sda/chatwoot/${USERNAME}/secrets:/secrets:ro
    depends_on:
      - secrets-init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 200
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Only this stack can reach it, so it needs no password.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - /mnt/nas-sda/chatwoot/${USERNAME}/redis:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  rails:
    image: chatwoot/chatwoot:v4.19.1-ce
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    # Keys come from the files made by secrets-init. The database is
    # created or migrated on every start, then the web server runs.
    command:
      - sh
      - -ec
      - |
        export SECRET_KEY_BASE="$$(cat /secrets/secret_key_base)"
        export POSTGRES_PASSWORD="$$(cat /secrets/db_password)"
        bundle exec rails db:chatwoot_prepare
        exec bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      - TZ=${TIMEZONE}
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - FRONTEND_URL=https://chat-${USERNAME}.${DOMAIN}
      # TLS ends at Cloudflare; Rails would redirect forever otherwise.
      - FORCE_SSL=false
      # The first visit creates the owner's account; nobody else can sign up.
      - ENABLE_ACCOUNT_SIGNUP=false
      - DEFAULT_LOCALE=en
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://redis:6379
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - LOG_LEVEL=warn
      - RAILS_MAX_THREADS=5
      - DISABLE_TELEMETRY=true
      - ENABLE_PUSH_RELAY_SERVER=false
      # Optional mail, set by the customer (agent invites, password resets).
      - MAILER_SENDER_EMAIL=${SMTP_FROM}
      - SMTP_ADDRESS=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHENTICATION=login
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_DOMAIN=${DOMAIN}
    expose:
      - "3000"
    volumes:
      - /mnt/nas-sda/chatwoot/${USERNAME}/storage:/app/storage
      - /mnt/nas-sda/chatwoot/${USERNAME}/secrets:/secrets:ro
    depends_on:
      - secrets-init
      - postgres
      - redis
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 512
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  sidekiq:
    image: chatwoot/chatwoot:v4.19.1-ce
    restart: unless-stopped
    command:
      - sh
      - -ec
      - |
        export SECRET_KEY_BASE="$$(cat /secrets/secret_key_base)"
        export POSTGRES_PASSWORD="$$(cat /secrets/db_password)"
        exec bundle exec sidekiq -C config/sidekiq.yml
    environment:
      - TZ=${TIMEZONE}
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - FRONTEND_URL=https://chat-${USERNAME}.${DOMAIN}
      - FORCE_SSL=false
      - ENABLE_ACCOUNT_SIGNUP=false
      - DEFAULT_LOCALE=en
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://redis:6379
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - LOG_LEVEL=warn
      - SIDEKIQ_CONCURRENCY=5
      - DISABLE_TELEMETRY=true
      - ENABLE_PUSH_RELAY_SERVER=false
      - MAILER_SENDER_EMAIL=${SMTP_FROM}
      - SMTP_ADDRESS=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_AUTHENTICATION=login
      - SMTP_ENABLE_STARTTLS_AUTO=true
      - SMTP_DOMAIN=${DOMAIN}
    volumes:
      - /mnt/nas-sda/chatwoot/${USERNAME}/storage:/app/storage
      - /mnt/nas-sda/chatwoot/${USERNAME}/secrets:/secrets:ro
    depends_on:
      - rails
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
          pids: 256
        reservations:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
