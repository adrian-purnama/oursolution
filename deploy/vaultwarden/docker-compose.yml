# Vaultwarden hosting — one stack per customer, deployed by Dokploy.
#
# Product settings: deploy/vaultwarden/product.json
# Data: /mnt/nas-sda/vaultwarden/<username>/ (inside DEPLOY_DATA_ROOTS, so
# "Reset" and the admin "Delete data" can empty it).

services:
  # Vaultwarden runs as uid 1000 below; Docker creates a missing bind folder
  # as root, which it could not write to.
  init-perms:
    image: busybox:1.36
    restart: "no"
    network_mode: none
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - /mnt/nas-sda/vaultwarden/${USERNAME}/data:/data

  vaultwarden:
    image: vaultwarden/server:1.37.5-alpine
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=${TIMEZONE}
      - DOMAIN=https://vault-${USERNAME}.${DOMAIN}
      - ROCKET_PORT=8080
      # Nobody can sign up on their own. The customer sets their own
      # ADMIN_TOKEN (empty keeps /admin switched off), opens /admin and
      # invites their own email; without SMTP an invited address can then
      # register directly.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - SHOW_PASSWORD_HINT=false
      - PASSWORD_HINTS_ALLOWED=false
      # Real client address from Cloudflare, for the login rate limits.
      - IP_HEADER=CF-Connecting-IP
      - LOGIN_RATELIMIT_SECONDS=60
      - LOGIN_RATELIMIT_MAX_BURST=10
      - ADMIN_RATELIMIT_SECONDS=300
      - ADMIN_RATELIMIT_MAX_BURST=3
      # Storage caps, in kilobytes: 1 GB of attachments per user and per
      # organization, and 256 MB of file Sends per user.
      - USER_ATTACHMENT_LIMIT=1048576
      - ORG_ATTACHMENT_LIMIT=1048576
      - USER_SEND_LIMIT=262144
      - ORG_EVENTS_ENABLED=true
      - EVENTS_DAYS_RETAIN=90
      - LOG_LEVEL=warn
    expose:
      - "8080"
    volumes:
      - /mnt/nas-sda/vaultwarden/${USERNAME}/data:/data
    depends_on:
      - init-perms
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
